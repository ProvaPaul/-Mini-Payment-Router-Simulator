# ---------------------------------------------------------------------------
# Payment Router - application configuration
#
# Spring Boot reads this file automatically from src/main/resources.
# YAML is used instead of .properties because it nests: related settings sit
# together visually, which matters now that fee rules have arrived.
#
# Every value here can be overridden at runtime WITHOUT rebuilding, by an
# environment variable using SCREAMING_SNAKE_CASE
# (e.g. SERVER_PORT=9090, ROUTER_QUOTE_ROUTERFEE=0).
# That is exactly how Step 9 will point this same image at the DFSP containers.
# ---------------------------------------------------------------------------

server:
  # The port embedded Tomcat listens on. 8080 per the Step 1 port map.
  port: 8080

spring:
  application:
    # Appears in log output and in Actuator. Also the default name used by tracing tools.
    name: payment-router

  jackson:
    serialization:
      # WITHOUT this, Jackson writes java.time.Instant as a raw epoch number
      # (1757606400.123456789), which is unreadable and awkward for JavaScript.
      # With it, we get ISO-8601: "2026-09-11T20:00:00Z" - which `new Date(...)`
      # in the React frontend parses directly.
      write-dates-as-timestamps: false
    # Do not emit keys whose value is null. Keeps responses small and unambiguous.
    default-property-inclusion: non_null

# -----------------------------------------------------------------------------
# Our own settings. Bound to the RouterProperties record by @ConfigurationProperties.
# Anything under a custom prefix like this is application config, not Spring config.
# -----------------------------------------------------------------------------
router:
  service-name: payment-router
  version: 0.1.0-step3
  environment: local

  # Single currency for the whole deployment. This simulator does no FX.
  currency: BDT

  quote:
    # The router's own flat switching fee, charged on top of the provider's fee.
    # This is what the hub earns for providing interoperability.
    router-fee: 5.00

    # How long a quoted price is honoured. Spring parses "5m" into a java.time.Duration,
    # so the unit is written down rather than remembered.
    #
    # WHY a quote expires at all: a quote is a price PROMISE. Fees and balances change.
    # An eternal quote would let someone hold today's price forever and spend it next month.
    # Five minutes is long enough for a person to read the fee and click Confirm, and short
    # enough that we can demonstrate expiry in a test.
    ttl: 5m

  # ---------------------------------------------------------------------------
  # PER-PROVIDER FEE RULES  (the documented assumption for this simulator)
  #
  # Keys must match the constants in the Dfsp enum.
  #
  # The two providers charge in deliberately DIFFERENT ways. That is the point:
  # if both priced identically, the frontend could compute the fee itself and a
  # quote API would be pointless. Because they differ, the price depends on the
  # DIRECTION of the transfer, and only the router can work it out.
  #
  # These numbers are invented for the simulator. They are shaped after how real
  # mobile-money providers price transfers, but they are not anyone's real tariff.
  # ---------------------------------------------------------------------------
  providers:

    # bKash analogy: a percentage of the amount, with a floor and a ceiling.
    # Percentage pricing scales with risk and value, and the cap stops large
    # transfers becoming absurdly expensive.
    DFSP_A:
      display-name: AlphaPay
      fee-type: PERCENTAGE
      percentage: 1.85       # 1.85% of the amount
      min-fee: 5.00          # never charge less than this
      max-fee: 50.00         # never charge more than this

    # Nagad analogy: one flat charge, whatever the amount.
    # Simple to advertise; cheap for big transfers, poor value for small ones.
    DFSP_B:
      display-name: BetaCash
      fee-type: FLAT
      flat-fee: 15.00

# -----------------------------------------------------------------------------
# Spring Boot Actuator.
# By default Actuator exposes almost nothing over HTTP - a safe default we keep.
# We deliberately expose ONLY `health`. Endpoints such as `env` and `configprops`
# would publish configuration to anyone who can reach the port.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Show the individual checks (disk space, ping) rather than a bare {"status":"UP"}.
      # Fine for a simulator; in a real system this is information disclosure, so you would
      # set `when-authorized` instead.
      show-details: always

logging:
  level:
    # Our own code logs at INFO. Change to DEBUG to see the log.debug(...) lines.
    com.misl.paymentrouter: INFO
    # Spring itself stays at INFO; set to DEBUG only when diagnosing startup problems.
    org.springframework: INFO
  pattern:
    # Console pattern: time, level, logger (shortened to 40 chars), message.
    # Step 7 replaces this with logback-spring.xml, adding a rolling FILE appender
    # and the correlation ID.
    console: "%d{HH:mm:ss.SSS} %-5level %logger{40} - %msg%n"
